<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumina | RenCrow</title>
  <link rel="stylesheet" href="/assets/lumina.css">
</head>
<body>
  <main class="lumina-screen" aria-labelledby="lumina-title">
    <section class="lumina-card">
      <div class="lumina-copy">
        <p class="lumina-kicker">RenCrow / CHARACTER PREVIEW</p>
        <h1 id="lumina-title">Lumina</h1>
        <p class="lumina-subtitle">やさしい光が、そばにあるように。</p>
        <p class="lumina-description">PORTALに追加されたLuminaの表示確認画面です。表情パーツを切り替えて、配置と素材の見え方を確認できます。</p>
        <div class="lumina-status" role="status" aria-live="polite"><span class="lumina-status-dot"></span><span id="luminaStatus">通常表情</span></div>
        <div class="lumina-controls" aria-label="Lumina 表情切り替え">
          <button type="button" class="is-active" data-expression="normal">通常</button>
          <button type="button" data-expression="smile">にこにこ</button>
          <button type="button" data-expression="blink">まばたき</button>
        </div>
        <a class="lumina-back" href="/chat">Chatへ戻る</a>
      </div>
      <div class="lumina-stage" aria-label="Lumina preview">
        <div class="lumina-halo"></div>
        <img id="luminaCharacter" src="/assets/lumina-assets/Lumina.png" alt="Luminaの立ち絵">
        <p class="lumina-caption">Lumina <span>visual preview</span></p>
      </div>
    </section>
  </main>
  <script src="/assets/other_presence.js" defer></script>
  <script src="/assets/lumina.js" defer></script>
</body>
</html>
