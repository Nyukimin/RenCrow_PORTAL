<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171d35">
  <title>RenCrow PORTAL | HOUSE</title>
  <link rel="stylesheet" href="/assets/living/living.css?v={{.AssetVersion}}">
  <script defer src="/assets/living/vendor/three-kit.js"></script>
  <script defer src="/assets/living/assets/house-data.js?v={{.AssetVersion}}"></script>
  <script defer src="/assets/living/sd-motion.js?v={{.AssetVersion}}"></script>
  <script defer src="/assets/living/hobby-motion.js?v={{.AssetVersion}}"></script>
  <script defer src="/assets/living/world-home.js?v={{.AssetVersion}}"></script>
  <script defer src="/assets/living/scene.js?v={{.AssetVersion}}"></script>
  <script defer src="/assets/living/living.js?v={{.AssetVersion}}"></script>
</head>
<body>
  <div class="page-shell living" data-board-url="{{.BoardURL}}" data-asset-version="{{.AssetVersion}}" data-world-home-enabled="{{.WorldHomeEnabled}}" data-house-asset-verified="{{.HouseAssetVerified}}" data-house-sha256="{{.HouseAssetSHA256}}">
    <header class="site-header">
      <a class="brand" href="/" aria-label="RenCrow PORTAL ホーム">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-name">RenCrow PORTAL</span>
      </a>

      <nav class="view-switch" aria-label="表示するビュー">
        <button id="house-tab" class="view-tab" type="button" aria-pressed="true" data-view="lcp">HOUSE</button>
        <button id="living-tab" class="view-tab" type="button" aria-pressed="false" data-view="workplace">LIVING</button>
        {{if .BoardURL}}<a class="view-tab board-tab" id="board-tab" href="{{.BoardURL}}">BOARD</a>
        {{else}}<span class="view-tab board-tab is-disabled" id="board-tab" role="link" aria-disabled="true" title="BOARDの接続先が未設定です">BOARD</span>{{end}}
      </nav>

      <time class="portal-clock" id="jst-clock" aria-label="日本標準時">
        <svg class="portal-clock-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
        <span class="portal-clock-date" id="jst-clock-date">--月--日(--)</span>
        <strong class="portal-clock-time" id="jst-clock-time">--:--</strong>
      </time>
    </header>

    <main id="top" class="portal-main">
      <section class="scene-section" aria-label="RenCrow House">
        <div class="scene-frame" id="scene-frame" data-view="house">
          <div class="scene-viewport">
            <canvas id="scene" aria-label="RenCrow House のHOUSE_105 3Dシーン" role="img"></canvas>
            <div id="scene-heartbeat-bubbles" class="scene-heartbeat-bubbles" aria-live="off"></div>
            <p id="living-game-status" class="scene-game-status" role="status" aria-live="polite" hidden></p>
            <p class="scene-load-status" id="scene-load-status" role="status" aria-live="polite"></p>
          </div>
        </div>
        <div class="living-game-keyboard-actions" role="group" aria-label="ゲーム中の住人を開く">
          <button type="button" data-game-actor="mio">ゲーム中のMioを開く</button>
          <button type="button" data-game-actor="shiro">ゲーム中のShiroを開く</button>
          <button type="button" data-game-actor="kuro">ゲーム中のKuroを開く</button>
          <button type="button" data-game-actor="midori">ゲーム中のMidoriを開く</button>
          <button type="button" data-game-actor="aka">ゲーム中のAkaを開く</button>
          <button type="button" data-game-actor="ao">ゲーム中のAoを開く</button>
          <button type="button" data-game-actor="kin">ゲーム中のKinを開く</button>
          <button type="button" data-game-actor="gin">ゲーム中のGinを開く</button>
        </div>
      </section>
    </main>
    <dialog id="living-active-game-dialog" aria-labelledby="living-active-game-title">
      <form method="dialog" class="living-active-game-dialog__content">
        <h2 id="living-active-game-title">観戦するゲームを選択</h2>
        <p id="living-active-game-description"></p>
        <div id="living-active-game-options" class="living-active-game-options"></div>
        <button type="submit" class="living-active-game-cancel">キャンセル</button>
      </form>
    </dialog>
  </div>
</body>
</html>
